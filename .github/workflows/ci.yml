name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    # Runs the gate from the BASE branch against the proposed change, so a pull request cannot weaken its own gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { ref: "${{ github.event.pull_request.base.sha }}", path: trusted, persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { ref: "${{ github.event.pull_request.head.sha }}", path: change, fetch-depth: 0, persist-credentials: false }
      - run: git -C change fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - run: python3 trusted/tools/contribution_gate.py check --repo change --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: "22" }
      - run: python -m pip install -r dashboard/backend/requirements.txt pytest pytest-xdist
      - run: scripts/run_core_tests.sh tests/test_core_clean_install.py tests/test_core_separation.py tests/test_site_config.py tests/test_contribution_gate.py
      - run: npm ci && npm test
        working-directory: dashboard/frontend
  full-suite:
    # Informational: some tests have documented environment failures (tests/core_known_failures.json).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: { python-version: "3.12" }
      - run: python -m pip install -r dashboard/backend/requirements.txt pytest pytest-xdist
      - run: scripts/run_core_tests.sh
