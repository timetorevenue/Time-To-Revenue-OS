# Factory build spec. The package under agents/packages/marketing.linkedin_post is generated from this folder:
# edit here and run `aos-agent.py build marketing.linkedin_post`; never edit the package.
# Revisit: when the content workflow rules, the prompt or the pinned model changes. · Last touched: 2026-11-14.
[agent]
name = "marketing.linkedin_post"
version = "0.1.0"
kind = "oneshot"
summary = "Draft one LinkedIn post from supplied notes, with every factual point backed by an exact quote and no client named."
author = "Time to Revenue"

[io]
input_schema = "schemas/input.json"
output_schema = "schemas/output.json"

[context]
needs = ["input.evidence_refs"]
max_tokens = 3000

[capabilities]
grants = ["brain.read:global"]
proposes = []
tools = []

[budget]
tokens = 12000
model_calls = 2
seconds = 90
max_steps = 1

[compose]
callable_by = ["marketing.*", "shared.planner"]
calls = []

[factory]
requirement = "Draft stage of the LinkedIn content workflow: a raw idea, meeting note or client lesson becomes one post in Casey's plain voice. A lesson from client work is anonymised; no result or figure is invented, so each factual point must quote the notes word for word. The result is a draft for Casey's approval. It proposes no effect and nothing is ever posted. Called by the marketing.content plan and by planner-built plans."
token_budget = 220000
holdout_share = 0.2
source = "workflows/linkedin_content/workflow.md (stages Draft and CTA; approval rules); blueprint section 7: marketing.linkedin_post"

# Cheapest first. The first candidate that passes the training cases is pinned.
[[factory.candidates]]
prompt = "prompts/main.md"
model = "gpt-6-luna"
effort = "low"

[[factory.candidates]]
prompt = "prompts/main.md"
model = "gpt-6-luna"
effort = "medium"
